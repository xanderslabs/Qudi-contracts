[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# via_ir is NOT adopted. It reaches only a 225-byte margin, which fails the size gate's own
# 2,000-byte threshold, and it silently swallows `vm.warp(block.timestamp + X)` because the IR
# optimizer legally caches TIMESTAMP across the cheatcode call. 127 such sites exist in test/.
# CreditCore is brought under the limit by moving Standing to its own contract instead.
# Do not set this without weighing both of those costs.
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32 }

# deep profile: nightly and before any deployment; a deployment requires a green
# deep run on the exact commit
[profile.deep]
fuzz = { runs = 50000 }
invariant = { runs = 5000, depth = 100 }

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc = "${ARC_RPC_URL}"
